x-ros-domain-migration:
  section: camera
type: object
additionalProperties: false
required:
- camera
- stream
properties:
  camera:
    type: object
    additionalProperties: false
    required:
    - exposure_us
    properties:
      ros_domain_id:
        type: integer
        minimum: -1
        maximum: 232
        default: -1
        need_restart: true
        description: ROS_DOMAIN_ID used by the camera and its consumers (-1 inherits
          sys.ros2_default_domain_id).
      exposure_us:
        type: integer
        minimum: 0
        maximum: 33333
        default: 5000
        need_restart: true
        description: Fixed exposure in microseconds (0 enables Argus auto-exposure).
          Default 5 ms from the calibrated airborne profile.
  stream:
    type: object
    additionalProperties: false
    required:
    - mode
    - width
    - fps
    - bitrate_kbps
    - iframe_interval
    - config
    - qp
    - hw_preset
    - profile
    properties:
      mode:
        type: string
        default: native_nvenc
        need_restart: true
        description: Select the hardware video path.
        enum:
        - native_nvenc
        - isaac_ros_h264
        - 'off'
      publish_compressed_image:
        type: boolean
        default: false
        need_restart: true
        description: In isaac_ros_h264 mode, also publish /camera/image_compressed for legacy subscribers.
      width:
        type: integer
        default: 960
        need_restart: true
        description: Native NVENC width. Aspect ratio is preserved.
        enum:
        - 640
        - 960
        - 1280
      fps:
        type: integer
        default: 15
        need_restart: true
        description: Maximum encoder input frames per second.
        minimum: 1
        maximum: 30
      bitrate_kbps:
        type: integer
        default: 1500
        need_restart: true
        description: Target bitrate in kbit/s for native NVENC or the Isaac custom preset.
        minimum: 300
        maximum: 8000
      iframe_interval:
        type: integer
        default: 15
        need_restart: true
        description: Frames between keyframes (native, or Isaac custom preset).
        minimum: 1
        maximum: 120
      config:
        type: string
        default: custom
        need_restart: true
        description: Isaac encoder preset. Custom uses the fields below.
        enum:
        - custom
        - pframe_cqp
        - iframe_cqp
      qp:
        type: integer
        default: 24
        need_restart: true
        description: Isaac qp parameter. Isaac ROS 5.0 controls the custom preset by bitrate.
        minimum: 0
        maximum: 51
      hw_preset:
        type: integer
        default: 0
        need_restart: true
        description: Isaac custom hardware preset, from 0 (ultrafast) to 3 (slow).
        minimum: 0
        maximum: 3
      profile:
        type: integer
        default: 1
        need_restart: true
        description: Isaac custom H.264 profile (0 Main, 1 Baseline, 2 High).
        minimum: 0
        maximum: 2
