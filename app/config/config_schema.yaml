type: object
additionalProperties: false
required: [camera, preview]
properties:
  ros:
    type: object
    additionalProperties: false
    required: [domain_id]
    properties:
      domain_id:
        type: integer
        minimum: 0
        maximum: 232
        need_restart: true
        description: 兼容旧版配置。存在 camera.ros_domain_id 时以新字段为准。
  camera:
    type: object
    additionalProperties: false
    required: [exposure_us]
    properties:
      ros_domain_id:
        type: integer
        minimum: -1
        maximum: 232
        default: -1
        need_restart: true
        description: ROS_DOMAIN_ID used by the camera and its consumers (-1 inherits sys.ros2_default_domain_id).
      exposure_us:
        type: integer
        minimum: 0
        maximum: 33333
        default: 5000
        need_restart: true
        description: Fixed exposure in microseconds (0 enables Argus auto-exposure). Default 5 ms from the calibrated airborne profile.
  preview:
    type: object
    additionalProperties: false
    required: [enabled, fps, width, jpeg_quality, codec, h264_bitrate_kbps]
    properties:
      enabled:
        type: boolean
        default: true
        need_restart: true
        description: 启用按需可视化压缩旁路（发布标准 /camera/image_raw/compressed 与内置 Web 预览页；无人订阅或观看时自动退订零开销）。
      fps:
        type: number
        minimum: 1
        maximum: 30
        default: 15.0
        need_restart: true
        description: 压缩流目标帧率（Hz），也可在内置 Web UI 中实时调节。
      width:
        type: integer
        minimum: 0
        maximum: 1280
        default: 960
        need_restart: true
        description: 预览宽度（像素）。0 使用原生 1280×720。JPEG 使用所设宽度，H.264 最小宽度为 320 并向下对齐至偶数。原始图像始终为 1280×720。
      jpeg_quality:
        type: integer
        minimum: 40
        maximum: 95
        default: 85
        need_restart: true
        description: JPEG 编码画质（40-95），建议 80-88 兼顾清晰度与无线带宽。
      codec:
        type: string
        enum: [auto, nvenc_h264, jpeg]
        default: auto
        need_restart: true
        description: Web 预览编码策略（auto 自动探测 Jetson 硬件 NVENC H.264 / TurboJPEG；ROS /camera/image_raw/compressed 始终按标准 JPEG 发布以兼容 Zenoh/Foxglove/RViz）。
      h264_bitrate_kbps:
        type: integer
        minimum: 500
        maximum: 12000
        default: 3000
        need_restart: true
        description: 启用 H.264 硬件编码时的目标码率（kbps）。
