<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>IMX219 Isaac ROS Camera</title>
  <style>
    :root {
      --bg: #0f141c;
      --panel: #171f2b;
      --panel-2: #1e2938;
      --border: #2a374b;
      --text: #e6edf6;
      --muted: #8ea0b8;
      --accent: #3b82f6;
      --ok: #22c55e;
      --warn: #f59e0b;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans SC", sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 16px;
    }
    header {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 14px;
    }
    h1 { margin: 0; font-size: 20px; font-weight: 600; }
    .sub { color: var(--muted); font-size: 13px; margin-top: 2px; }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; }
    .chip {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 4px 10px;
      font-size: 12px;
      color: var(--muted);
    }
    .chip strong { color: var(--text); }
    .chip.ok strong { color: var(--ok); }
    .chip.warn strong { color: var(--warn); }
    .layout {
      display: grid;
      grid-template-columns: minmax(320px, 1.8fr) minmax(260px, 1fr);
      gap: 16px;
      align-items: start;
    }
    @media (max-width: 960px) { .layout { grid-template-columns: 1fr; } }
    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px 16px;
    }
    .card h2 { margin: 0 0 10px 0; font-size: 15px; display: flex; justify-content: space-between; align-items: center; }
    .stage {
      background: #080b10;
      border: 1px solid var(--border);
      border-radius: 8px;
      aspect-ratio: 16 / 9;
      width: 100%;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }
    .stage img, .stage video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }
    .paused-banner {
      color: var(--muted);
      font-size: 14px;
      text-align: center;
      padding: 16px;
    }
    .controls { display: flex; flex-direction: column; gap: 12px; }
    label { display: flex; flex-direction: column; gap: 5px; font-size: 12px; color: var(--muted); }
    select, input[type="range"] {
      width: 100%;
      background: var(--panel-2);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 6px;
      padding: 6px 8px;
      font-size: 13px;
    }
    input[type="range"] { padding: 0; border: none; background: transparent; }
    .btn-row { display: flex; flex-wrap: wrap; gap: 8px; }
    .btn {
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: 8px 12px;
      font-size: 13px;
      cursor: pointer;
      font-weight: 500;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .btn.secondary { background: var(--panel-2); border: 1px solid var(--border); color: var(--text); }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; color: var(--muted); white-space: pre-wrap; }
    .msg { font-size: 12px; min-height: 16px; color: var(--ok); }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>IMX219 Isaac ROS Camera</h1>
      <div class="sub">原生 CUDA 零拷贝供 AprilTag 感知 · 按需高速压缩供 ROS / Zenoh / Web 可视化</div>
    </div>
    <div class="chips" id="chips">
      <span class="chip">状态: <strong>连接中...</strong></span>
    </div>
  </header>

  <div class="layout">
    <section class="card">
      <h2>
        <span>实时低延迟图传预览</span>
        <span class="mono" id="streamStats">等待流...</span>
      </h2>
      <div class="stage" id="stage">
        <img id="mjpegView" alt="IMX219 Live Preview" />
      </div>
      <div class="btn-row" style="margin-top:12px">
        <button class="btn" id="toggleBtn">暂停预览（释放零拷贝零开销）</button>
        <a class="btn secondary" id="snapLink" href="../api/snapshot.jpg" download="imx219_snapshot.jpg">下载高清抓拍 JPG</a>
        <button class="btn secondary" id="modeBtn" style="display:none">切换 H.264 硬件流</button>
      </div>
    </section>

    <section class="card">
      <h2>可视化编码参数（实时生效，免重启）</h2>
      <div class="controls">
        <label>
          预览分辨率（原生 /camera/image_raw 始终保持 1280×720）
          <select id="widthSel">
            <option value="0">1280 × 720（原生高清）</option>
            <option value="960" selected>960 × 540（推荐清晰平衡）</option>
            <option value="640">640 × 360（极低带宽）</option>
          </select>
        </label>
        <label>
          目标帧率 (FPS)
          <select id="fpsSel">
            <option value="5">5 FPS</option>
            <option value="10">10 FPS</option>
            <option value="15" selected>15 FPS（推荐）</option>
            <option value="20">20 FPS</option>
            <option value="30">30 FPS（满帧）</option>
          </select>
        </label>
        <label>
          <span>JPEG 画质：<strong id="qVal">85</strong></span>
          <input id="qRange" type="range" min="40" max="95" step="1" value="85" />
        </label>
        <button class="btn" id="applyBtn">应用编码设置</button>
        <div class="msg" id="msg"></div>
      </div>

      <h2 style="margin-top:16px">硬件编码器与 ROS 话题状态</h2>
      <div class="mono" id="detailBox"></div>
    </section>
  </div>

  <script>
    const API = '../api';
    const $ = (id) => document.getElementById(id);
    let playing = true;
    let mode = 'mjpeg';
    let h264Supported = false;
    let initForm = false;

    function startStream() {
      const stage = $('stage');
      if (!playing) {
        stage.innerHTML = '<div class="paused-banner">预览已暂停（后端 2 秒后自动退订 /camera/image_raw，CPU/GPU 额外开销归零）</div>';
        return;
      }
      if (mode === 'h264' && h264Supported) {
        stage.innerHTML = `<video autoplay muted playsinline controls src="${API}/stream.mp4?t=${Date.now()}"></video>`;
      } else {
        stage.innerHTML = `<img id="mjpegView" alt="IMX219 Live Preview" src="${API}/stream.mjpg?t=${Date.now()}" />`;
      }
    }

    $('toggleBtn').addEventListener('click', () => {
      playing = !playing;
      $('toggleBtn').textContent = playing ? '暂停预览（释放零拷贝零开销）' : '恢复实时预览';
      startStream();
    });

    $('modeBtn').addEventListener('click', () => {
      mode = mode === 'mjpeg' ? 'h264' : 'mjpeg';
      $('modeBtn').textContent = mode === 'mjpeg' ? '切换 H.264 硬件流' : '切换低延迟 MJPEG';
      startStream();
    });

    $('qRange').addEventListener('input', () => {
      $('qVal').textContent = $('qRange').value;
    });

    $('applyBtn').addEventListener('click', async () => {
      $('msg').textContent = '应用中...';
      try {
        const res = await fetch(`${API}/settings`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            width: Number($('widthSel').value),
            fps: Number($('fpsSel').value),
            jpeg_quality: Number($('qRange').value),
          }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);
        $('msg').textContent = '已实时生效（无需重启相机）。';
      } catch (err) {
        $('msg').textContent = `失败: ${err.message}`;
      }
    });

    function renderStatus(s) {
      const caps = s.capabilities || {};
      h264Supported = Boolean(caps.h264_stream_backend);
      $('modeBtn').style.display = h264Supported ? 'inline-flex' : 'none';
      const jpegEnc = caps.turbojpeg ? 'TurboJPEG SIMD' : 'OpenCV JPEG';
      const h264Enc = caps.h264_stream_backend || '未安装 NVENC/FFmpeg';
      $('chips').innerHTML = `
        <span class="chip ${s.camera_fps > 0 ? 'ok' : 'warn'}">相机采集: <strong>${s.camera_fps} fps</strong></span>
        <span class="chip ${s.subscribed ? 'ok' : ''}">预览状态: <strong>${s.subscribed ? '按需推流中' : '空闲零开销'}</strong></span>
        <span class="chip">压缩订阅数: <strong>${s.ros_compressed_subscribers}</strong></span>
        <span class="chip">JPEG 编码: <strong>${jpegEnc}</strong></span>
        <span class="chip">H.264/NVENC: <strong>${h264Enc}</strong></span>
      `;
      $('streamStats').textContent =
        `${s.preview_fps} fps · ${(s.bitrate_kbps / 1000).toFixed(2)} Mbps · ${s.frame_kb} KB/帧 · 编码 ${s.encode_ms} ms`;
      $('detailBox').textContent = JSON.stringify({
        exposure_ms: s.exposure_us / 1000,
        ros_domain_id: s.ros_domain_id,
        discovery_range: s.discovery_range,
        topics: s.topics,
        capabilities: caps,
      }, null, 2);

      if (!initForm && s.settings) {
        $('widthSel').value = String(s.settings.width ?? 960);
        $('fpsSel').value = String(Math.round(s.settings.fps ?? 15));
        $('qRange').value = String(s.settings.jpeg_quality ?? 85);
        $('qVal').textContent = $('qRange').value;
        initForm = true;
      }
    }

    async function poll() {
      try {
        const res = await fetch(`${API}/status`, { cache: 'no-store' });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        renderStatus(await res.json());
      } catch (err) {
        $('chips').innerHTML = `<span class="chip warn">状态: <strong>未连接 (${err.message})</strong></span>`;
      }
    }

    startStream();
    poll();
    setInterval(poll, 1000);
  </script>
</body>
</html>
